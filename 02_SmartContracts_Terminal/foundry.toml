[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
solc_version = "0.8.28"

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[lint]
# block-timestamp: deshabilitado globalmente — el producto ES tiempo (rate/segundo, expiración
# de vouchers, timers de auto-release); la manipulación marginal del validador es irrelevante
# a esta escala. Resto de warnings se suprimen inline solo donde el spec lo exige.
exclude_lints = ["block-timestamp"]
